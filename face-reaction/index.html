<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>FACE REACTION • AI Facial Expression Detection</title>
    <script>
      // Enforce Single Tab: Close duplicate tabs automatically
      if (typeof BroadcastChannel !== 'undefined') {
        const bc = new BroadcastChannel('face_reaction_single_tab');
        const myId = Math.random().toString(36).substring(7);

        bc.postMessage({ type: 'CHECK_ACTIVE', id: myId });

        bc.onmessage = (e) => {
          if (e.data && e.data.type === 'CHECK_ACTIVE' && e.data.id !== myId) {
            // Tell the new tab that an active tab already exists
            bc.postMessage({ type: 'ALREADY_ACTIVE', targetId: e.data.id });
          } else if (e.data && e.data.type === 'ALREADY_ACTIVE' && e.data.targetId === myId) {
            // An existing game tab is already running!
            // Close this duplicate tab immediately so only one tab remains
            window.close();
          }
        };
      }

      if (window.location.protocol === 'file:') {
        window.location.replace('http://localhost:8003');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
